<svg xmlns="http://www.w3.org/2000/svg" class="gr" viewBox="0 0 680 658" width="680" height="658" role="img" aria-labelledby="t3 d3">
  <title id="t3">Esercizio 4.3: diagramma di Bode della rete ritardatrice</title>
  <desc id="d3">Diagramma di Bode asintotico di H(jω) = (1 + jωR2C) / (1 + jω(R1+R2)C) con R1 = 90 kΩ, R2 = 10 kΩ e C = 100 nF. Modulo in dB e fase in gradi in funzione di ω, in scala logaritmica. I contributi (costante 1, zero in 10^3 rad/s, polo in 10^2 rad/s) sono tratteggiati e numerati 1, 2, 3; la loro somma, in blu, è il diagramma finale: 0 dB fino a 10^2 rad/s, poi scende di 20 dB/dec fino a -20 dB in 10^3 rad/s e resta piatta. La fase scende a -45° fra 10 e 10^2 rad/s, resta a -45° fino a 10^3 rad/s e torna a 0° in 10^4 rad/s.</desc>

  <style>
.gr {
  /* colori (stessa palette delle altre figure) */
  --ink: #1f2933;
  --muted: #6b7785;
  --b1: #0f766e;     /* contributo 1 (la costante) */
  --b2: #a16207;     /* contributo 2 */
  --b3: #d1342b;     /* contributo 3 */
  --b4: #8a3ea8;     /* contributo 4 (solo es. 4.4) */
  --us: #1d5fd1;     /* somma = diagramma finale */
  font-family: Georgia, "Times New Roman", serif;
}
.gr text { fill: var(--ink); }

/* assi e riferimenti */
.gr .axis  { stroke: var(--ink); stroke-width: 1.7; fill: none; }
.gr .tick  { stroke: var(--ink); stroke-width: 1.7; fill: none; }
.gr .guide { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 3 4; opacity: .85; fill: none; }
.gr .grid  { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 5; opacity: .45; fill: none; }
.gr .mk-ink { fill: var(--ink); }

/* contributi (tratteggiati) e somma (piu' spessa) */
.gr .comp { fill: none; stroke-width: 2.1; stroke-dasharray: 6.5 5.5; stroke-linecap: butt; }
/* linee che si sovrappongono: "alt" sfasa il tratteggio, cosi' due linee uguali si vedono a trattini alterni;
   con tre linee sovrapposte si usa il tratteggio "comp3" e le fasi d1 e d2 */
.gr .alt   { stroke-dashoffset: 6; }
.gr .comp3 { stroke-dasharray: 4.5 9; }
.gr .d1    { stroke-dashoffset: 4.5; }
.gr .d2    { stroke-dashoffset: 9; }
.gr .sum  { fill: none; stroke-width: 3.8; stroke-linejoin: round; stroke-linecap: round; }

/* testi */
.gr .t-num   { font-size: 14px; }
.gr .t-val   { font-size: 15px; }
.gr .t-small { font-size: 13.5px; }
.gr .t-lab   { font-size: 17px; }
.gr .t-sum   { font-size: 16px; font-weight: 700; }
.gr .t-wh    { font-size: 13px; font-weight: 700; fill: #fff; }
.gr .t-mute  { fill: var(--muted); }
.gr .t-end   { text-anchor: end; }
.gr .t-mid   { text-anchor: middle; }
.gr .it  { font-style: italic; }
.gr .sm  { font-size: .75em; }
.gr .b   { font-weight: 700; }
.gr .s-ink { stroke: var(--ink); }
.gr .f-ink { fill: var(--ink); }
.gr .t-ink { fill: var(--ink); }
.gr .mk-ink { fill: var(--ink); }
.gr .s-b1 { stroke: var(--b1); }
.gr .f-b1 { fill: var(--b1); }
.gr .t-b1 { fill: var(--b1); }
.gr .mk-b1 { fill: var(--b1); }
.gr .s-b2 { stroke: var(--b2); }
.gr .f-b2 { fill: var(--b2); }
.gr .t-b2 { fill: var(--b2); }
.gr .mk-b2 { fill: var(--b2); }
.gr .s-b3 { stroke: var(--b3); }
.gr .f-b3 { fill: var(--b3); }
.gr .t-b3 { fill: var(--b3); }
.gr .mk-b3 { fill: var(--b3); }
.gr .s-b4 { stroke: var(--b4); }
.gr .f-b4 { fill: var(--b4); }
.gr .t-b4 { fill: var(--b4); }
.gr .mk-b4 { fill: var(--b4); }
.gr .s-us { stroke: var(--us); }
.gr .f-us { fill: var(--us); }
.gr .t-us { fill: var(--us); }
.gr .mk-us { fill: var(--us); }
  </style>

  <defs>
    <marker id="ah-ax3" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path class="mk-ink" d="M0 0L10 5L0 10z"/></marker>
    <marker id="ah-ink3" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto"><path class="mk-ink" d="M0 0L10 5L0 10z"/></marker>
    <marker id="ah-b13" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto"><path class="mk-b1" d="M0 0L10 5L0 10z"/></marker>
    <marker id="ah-b23" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto"><path class="mk-b2" d="M0 0L10 5L0 10z"/></marker>
    <marker id="ah-b33" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto"><path class="mk-b3" d="M0 0L10 5L0 10z"/></marker>
    <marker id="ah-b43" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto"><path class="mk-b4" d="M0 0L10 5L0 10z"/></marker>
    <marker id="ah-us3" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto"><path class="mk-us" d="M0 0L10 5L0 10z"/></marker>
    <clipPath id="cl-3"><rect x="90.0" y="62.0" width="552.0" height="224.0"/></clipPath>
  </defs>

  <g id="modulo">
    <!-- reticolo: una linea per decade, piu' marcate quelle delle frequenze notevoli -->
    <line class="grid" x1="200.4" y1="286.0" x2="200.4" y2="62.0"/>
    <line class="guide" x1="310.8" y1="286.0" x2="310.8" y2="62.0"/>
    <line class="guide" x1="421.2" y1="286.0" x2="421.2" y2="62.0"/>
    <line class="grid" x1="531.6" y1="286.0" x2="531.6" y2="62.0"/>
    <line class="grid" x1="642.0" y1="286.0" x2="642.0" y2="62.0"/>
    <line class="grid" x1="90.0" y1="258.0" x2="642.0" y2="258.0"/>
    <line class="grid" x1="90.0" y1="202.0" x2="642.0" y2="202.0"/>
    <line class="guide" x1="90.0" y1="146.0" x2="642.0" y2="146.0"/>
    <line class="grid" x1="90.0" y1="90.0" x2="642.0" y2="90.0"/>
    <!-- assi -->
    <line class="axis" x1="90.0" y1="286.0" x2="90.0" y2="48.0" marker-end="url(#ah-ax3)"/>
    <line class="axis" x1="90.0" y1="286.0" x2="656.0" y2="286.0" marker-end="url(#ah-ax3)"/>
    <text class="t-lab" x="38.0" y="30.0">|<tspan class="it">H</tspan>| (dB)</text>
    <text class="t-lab t-end" x="656.0" y="332.0"><tspan class="it">ω</tspan> (rad/s)</text>
    <path class="tick" d="M85.0 258.0H95.0"/>
    <text class="t-num t-end" x="80.0" y="263.0">−40</text>
    <path class="tick" d="M85.0 202.0H95.0"/>
    <text class="t-num t-end" x="80.0" y="207.0">−20</text>
    <path class="tick" d="M85.0 146.0H95.0"/>
    <text class="t-num t-end" x="80.0" y="151.0">0</text>
    <path class="tick" d="M85.0 90.0H95.0"/>
    <text class="t-num t-end" x="80.0" y="95.0">20</text>
    <path class="tick" d="M90.0 281.0V291.0"/>
    <text class="t-num t-mid" x="90.0" y="311.0">10<tspan class="sm" dy="-6.5">0</tspan></text>
    <path class="tick" d="M200.4 281.0V291.0"/>
    <text class="t-num t-mid" x="200.4" y="311.0">10<tspan class="sm" dy="-6.5">1</tspan></text>
    <path class="tick" d="M310.8 281.0V291.0"/>
    <text class="t-num t-mid" x="310.8" y="311.0">10<tspan class="sm" dy="-6.5">2</tspan></text>
    <path class="tick" d="M421.2 281.0V291.0"/>
    <text class="t-num t-mid" x="421.2" y="311.0">10<tspan class="sm" dy="-6.5">3</tspan></text>
    <path class="tick" d="M531.6 281.0V291.0"/>
    <text class="t-num t-mid" x="531.6" y="311.0">10<tspan class="sm" dy="-6.5">4</tspan></text>
    <path class="tick" d="M642.0 281.0V291.0"/>
    <text class="t-num t-mid" x="642.0" y="311.0">10<tspan class="sm" dy="-6.5">5</tspan></text>
    <!-- somma -->
    <path class="sum s-us" d="M90.0 146.0 L310.8 146.0 L421.2 202.0 L642.0 202.0"/>
    <!-- contributi -->
    <path class="comp s-b1" d="M90.0 146.0 L642.0 146.0" clip-path="url(#cl-3)"/>
    <path class="comp alt s-b2" d="M90.0 146.0 L421.2 146.0 L642.0 34.0" clip-path="url(#cl-3)"/>
    <path class="comp s-b3" d="M90.0 146.0 L310.8 146.0 L642.0 314.0" clip-path="url(#cl-3)"/>
    <text class="t-small t-mid t-mute" x="310.8" y="50.0"><tspan class="it">ω</tspan><tspan class="it sm" dy="4.5">p</tspan><tspan dy="-4.5"> = 10</tspan><tspan class="sm" dy="-6.5">2</tspan><tspan dy="6.5"> rad/s</tspan></text>
    <text class="t-small t-mid t-mute" x="421.2" y="50.0"><tspan class="it">ω</tspan><tspan class="it sm" dy="4.5">z</tspan><tspan dy="-4.5"> = 10</tspan><tspan class="sm" dy="-6.5">3</tspan><tspan dy="6.5"> rad/s</tspan></text>
    <circle class="f-us" cx="310.8" cy="146.0" r="4.5"/>
    <circle class="f-us" cx="421.2" cy="202.0" r="4.5"/>
    <text class="t-val t-end t-us" x="411.2" y="222.0">−20 dB</text>
    <circle class="f-b1" cx="564.7" cy="146.0" r="10"/>
    <text class="t-wh t-mid" x="564.7" y="150.6">1</text>
    <circle class="f-b2" cx="553.7" cy="78.8" r="10"/>
    <text class="t-wh t-mid" x="553.7" y="83.4">2</text>
    <circle class="f-b3" cx="553.7" cy="269.2" r="10"/>
    <text class="t-wh t-mid" x="553.7" y="273.8">3</text>
    <text class="t-small t-mid t-us" x="378.5" y="171.3" transform="rotate(26.90 378.5 171.3)">−20 dB/dec</text>
    <text class="t-small t-mid t-b2" x="461.7" y="116.5" transform="rotate(-26.90 461.7 116.5)">+20 dB/dec</text>
    <text class="t-small t-mid t-b3" x="467.8" y="246.9" transform="rotate(26.90 467.8 246.9)">−20 dB/dec</text>
    <text class="t-small t-mid t-us" x="597.8" y="219.0">0 dB/dec</text>
    <text class="t-sum t-us" x="443.3" y="187.0">somma</text>
    <circle class="f-b1" cx="515.3" cy="182.0" r="9.5"/>
    <text class="t-wh t-mid" x="515.3" y="186.6">1</text>
    <text class="t-val t-mid t-us" x="533.3" y="187.0">+</text>
    <circle class="f-b2" cx="551.3" cy="182.0" r="9.5"/>
    <text class="t-wh t-mid" x="551.3" y="186.6">2</text>
    <text class="t-val t-mid t-us" x="569.3" y="187.0">+</text>
    <circle class="f-b3" cx="587.3" cy="182.0" r="9.5"/>
    <text class="t-wh t-mid" x="587.3" y="186.6">3</text>
  </g>

  <g id="fase">
    <!-- reticolo: una linea per decade, piu' marcate quelle delle frequenze notevoli -->
    <line class="guide" x1="200.4" y1="602.0" x2="200.4" y2="382.0"/>
    <line class="guide" x1="310.8" y1="602.0" x2="310.8" y2="382.0"/>
    <line class="guide" x1="421.2" y1="602.0" x2="421.2" y2="382.0"/>
    <line class="guide" x1="531.6" y1="602.0" x2="531.6" y2="382.0"/>
    <line class="grid" x1="642.0" y1="602.0" x2="642.0" y2="382.0"/>
    <line class="grid" x1="90.0" y1="582.0" x2="642.0" y2="582.0"/>
    <line class="grid" x1="90.0" y1="537.0" x2="642.0" y2="537.0"/>
    <line class="guide" x1="90.0" y1="492.0" x2="642.0" y2="492.0"/>
    <line class="grid" x1="90.0" y1="447.0" x2="642.0" y2="447.0"/>
    <line class="grid" x1="90.0" y1="402.0" x2="642.0" y2="402.0"/>
    <!-- assi -->
    <line class="axis" x1="90.0" y1="602.0" x2="90.0" y2="368.0" marker-end="url(#ah-ax3)"/>
    <line class="axis" x1="90.0" y1="602.0" x2="656.0" y2="602.0" marker-end="url(#ah-ax3)"/>
    <text class="t-lab" x="38.0" y="350.0"><tspan class="it">φ</tspan> (°)</text>
    <text class="t-lab t-end" x="656.0" y="648.0"><tspan class="it">ω</tspan> (rad/s)</text>
    <path class="tick" d="M85.0 582.0H95.0"/>
    <text class="t-num t-end" x="80.0" y="587.0">−90</text>
    <path class="tick" d="M85.0 537.0H95.0"/>
    <text class="t-num t-end" x="80.0" y="542.0">−45</text>
    <path class="tick" d="M85.0 492.0H95.0"/>
    <text class="t-num t-end" x="80.0" y="497.0">0</text>
    <path class="tick" d="M85.0 447.0H95.0"/>
    <text class="t-num t-end" x="80.0" y="452.0">45</text>
    <path class="tick" d="M85.0 402.0H95.0"/>
    <text class="t-num t-end" x="80.0" y="407.0">90</text>
    <path class="tick" d="M90.0 597.0V607.0"/>
    <text class="t-num t-mid" x="90.0" y="627.0">10<tspan class="sm" dy="-6.5">0</tspan></text>
    <path class="tick" d="M200.4 597.0V607.0"/>
    <text class="t-num t-mid" x="200.4" y="627.0">10<tspan class="sm" dy="-6.5">1</tspan></text>
    <path class="tick" d="M310.8 597.0V607.0"/>
    <text class="t-num t-mid" x="310.8" y="627.0">10<tspan class="sm" dy="-6.5">2</tspan></text>
    <path class="tick" d="M421.2 597.0V607.0"/>
    <text class="t-num t-mid" x="421.2" y="627.0">10<tspan class="sm" dy="-6.5">3</tspan></text>
    <path class="tick" d="M531.6 597.0V607.0"/>
    <text class="t-num t-mid" x="531.6" y="627.0">10<tspan class="sm" dy="-6.5">4</tspan></text>
    <path class="tick" d="M642.0 597.0V607.0"/>
    <text class="t-num t-mid" x="642.0" y="627.0">10<tspan class="sm" dy="-6.5">5</tspan></text>
    <!-- somma -->
    <path class="sum s-us" d="M90.0 492.0 L200.4 492.0 L310.8 537.0 L421.2 537.0 L531.6 492.0 L642.0 492.0"/>
    <!-- contributi -->
    <path class="comp s-b1" d="M90.0 492.0 L642.0 492.0"/>
    <path class="comp alt s-b2" d="M90.0 492.0 L310.8 492.0 L531.6 402.0 L642.0 402.0"/>
    <path class="comp s-b3" d="M90.0 492.0 L200.4 492.0 L421.2 582.0 L642.0 582.0"/>
    <text class="t-small t-mid t-mute" x="200.4" y="370.0"><tspan class="it">ω</tspan><tspan class="it sm" dy="4.5">p</tspan><tspan dy="-4.5">/10</tspan></text>
    <text class="t-small t-mid t-mute" x="310.8" y="370.0"><tspan class="it">ω</tspan><tspan class="it sm" dy="4.5">p</tspan><tspan dy="-4.5"> = </tspan><tspan class="it">ω</tspan><tspan class="it sm" dy="4.5">z</tspan><tspan dy="-4.5">/10</tspan></text>
    <text class="t-small t-mid t-mute" x="421.2" y="370.0">10 <tspan class="it">ω</tspan><tspan class="it sm" dy="4.5">p</tspan><tspan dy="-4.5"> = </tspan><tspan class="it">ω</tspan><tspan class="it sm" dy="4.5">z</tspan></text>
    <text class="t-small t-mid t-mute" x="531.6" y="370.0">10 <tspan class="it">ω</tspan><tspan class="it sm" dy="4.5">z</tspan></text>
    <circle class="f-us" cx="200.4" cy="492.0" r="4.5"/>
    <circle class="f-us" cx="310.8" cy="537.0" r="4.5"/>
    <circle class="f-us" cx="421.2" cy="537.0" r="4.5"/>
    <circle class="f-us" cx="531.6" cy="492.0" r="4.5"/>
    <text class="t-val t-mid t-us" x="366.0" y="527.0">−45°</text>
    <circle class="f-b1" cx="377.0" cy="492.0" r="10"/>
    <text class="t-wh t-mid" x="377.0" y="496.6">1</text>
    <circle class="f-b2" cx="586.8" cy="402.0" r="10"/>
    <text class="t-wh t-mid" x="586.8" y="406.6">2</text>
    <circle class="f-b3" cx="586.8" cy="582.0" r="10"/>
    <text class="t-wh t-mid" x="586.8" y="586.6">3</text>
    <text class="t-small t-mid t-us" x="248.4" y="532.1" transform="rotate(22.18 248.4 532.1)">−45°/dec</text>
    <text class="t-small t-mid t-us" x="483.6" y="532.1" transform="rotate(-22.18 483.6 532.1)">+45°/dec</text>
  </g>
</svg>
