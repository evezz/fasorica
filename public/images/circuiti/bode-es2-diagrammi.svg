<svg xmlns="http://www.w3.org/2000/svg" class="gr" viewBox="0 0 680 674" width="680" height="674" role="img" aria-labelledby="t2 d2">
  <title id="t2">Esercizio 4.2: diagramma di Bode del filtro RL passa-alto</title>
  <desc id="d2">Diagramma di Bode asintotico di H(jω) = (jωL/R) / (1 + jωL/R) con R = 100 Ω e L = 1 mH. Modulo in dB e fase in gradi in funzione di ω, in scala logaritmica. I contributi (costante 1, zero nell'origine che vale 0 dB in 10^5 rad/s, polo in 10^5 rad/s) sono tratteggiati e numerati 1, 2, 3; la loro somma, in blu, è il diagramma finale: sale di 20 dB/dec fino a 0 dB in 10^5 rad/s e poi resta piatta, mentre la fase scende da 90° a 0° con 45° in 10^5 rad/s. Con -20 dB in 10^4 rad/s.</desc>

  <style>
.gr {
  /* colori (stessa palette delle altre figure) */
  --ink: #1f2933;
  --muted: #6b7785;
  --b1: #0f766e;     /* contributo 1 (la costante) */
  --b2: #a16207;     /* contributo 2 */
  --b3: #d1342b;     /* contributo 3 */
  --b4: #8a3ea8;     /* contributo 4 (solo es. 4.4) */
  --us: #1d5fd1;     /* somma = diagramma finale */
  font-family: Georgia, "Times New Roman", serif;
}
.gr text { fill: var(--ink); }

/* assi e riferimenti */
.gr .axis  { stroke: var(--ink); stroke-width: 1.7; fill: none; }
.gr .tick  { stroke: var(--ink); stroke-width: 1.7; fill: none; }
.gr .guide { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 3 4; opacity: .85; fill: none; }
.gr .grid  { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 5; opacity: .45; fill: none; }
.gr .mk-ink { fill: var(--ink); }

/* contributi (tratteggiati) e somma (piu' spessa) */
.gr .comp { fill: none; stroke-width: 2.1; stroke-dasharray: 6.5 5.5; stroke-linecap: butt; }
/* linee che si sovrappongono: "alt" sfasa il tratteggio, cosi' due linee uguali si vedono a trattini alterni;
   con tre linee sovrapposte si usa il tratteggio "comp3" e le fasi d1 e d2 */
.gr .alt   { stroke-dashoffset: 6; }
.gr .comp3 { stroke-dasharray: 4.5 9; }
.gr .d1    { stroke-dashoffset: 4.5; }
.gr .d2    { stroke-dashoffset: 9; }
.gr .sum  { fill: none; stroke-width: 3.8; stroke-linejoin: round; stroke-linecap: round; }

/* testi */
.gr .t-num   { font-size: 14px; }
.gr .t-val   { font-size: 15px; }
.gr .t-small { font-size: 13.5px; }
.gr .t-lab   { font-size: 17px; }
.gr .t-sum   { font-size: 16px; font-weight: 700; }
.gr .t-wh    { font-size: 13px; font-weight: 700; fill: #fff; }
.gr .t-mute  { fill: var(--muted); }
.gr .t-end   { text-anchor: end; }
.gr .t-mid   { text-anchor: middle; }
.gr .it  { font-style: italic; }
.gr .sm  { font-size: .75em; }
.gr .b   { font-weight: 700; }
.gr .s-ink { stroke: var(--ink); }
.gr .f-ink { fill: var(--ink); }
.gr .t-ink { fill: var(--ink); }
.gr .mk-ink { fill: var(--ink); }
.gr .s-b1 { stroke: var(--b1); }
.gr .f-b1 { fill: var(--b1); }
.gr .t-b1 { fill: var(--b1); }
.gr .mk-b1 { fill: var(--b1); }
.gr .s-b2 { stroke: var(--b2); }
.gr .f-b2 { fill: var(--b2); }
.gr .t-b2 { fill: var(--b2); }
.gr .mk-b2 { fill: var(--b2); }
.gr .s-b3 { stroke: var(--b3); }
.gr .f-b3 { fill: var(--b3); }
.gr .t-b3 { fill: var(--b3); }
.gr .mk-b3 { fill: var(--b3); }
.gr .s-b4 { stroke: var(--b4); }
.gr .f-b4 { fill: var(--b4); }
.gr .t-b4 { fill: var(--b4); }
.gr .mk-b4 { fill: var(--b4); }
.gr .s-us { stroke: var(--us); }
.gr .f-us { fill: var(--us); }
.gr .t-us { fill: var(--us); }
.gr .mk-us { fill: var(--us); }
  </style>

  <defs>
    <marker id="ah-ax2" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path class="mk-ink" d="M0 0L10 5L0 10z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto"><path class="mk-ink" d="M0 0L10 5L0 10z"/></marker>
    <marker id="ah-b12" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto"><path class="mk-b1" d="M0 0L10 5L0 10z"/></marker>
    <marker id="ah-b22" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto"><path class="mk-b2" d="M0 0L10 5L0 10z"/></marker>
    <marker id="ah-b32" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto"><path class="mk-b3" d="M0 0L10 5L0 10z"/></marker>
    <marker id="ah-b42" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto"><path class="mk-b4" d="M0 0L10 5L0 10z"/></marker>
    <marker id="ah-us2" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto"><path class="mk-us" d="M0 0L10 5L0 10z"/></marker>
  </defs>

