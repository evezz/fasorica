    <text class="t-small t-mid t-mute" x="228.0" y="50.0"><tspan class="it">ω</tspan><tspan class="it sm" dy="4.5">p</tspan><tspan dy="-4.5">/10</tspan></text>
    <text class="t-small t-mid t-mute" x="366.0" y="50.0"><tspan class="it">ω</tspan><tspan class="it sm" dy="4.5">z</tspan><tspan dy="-4.5"> = </tspan><tspan class="it">ω</tspan><tspan class="it sm" dy="4.5">p</tspan><tspan dy="-4.5"> = 10</tspan><tspan class="sm" dy="-6.5">5</tspan><tspan dy="6.5"> rad/s</tspan></text>
