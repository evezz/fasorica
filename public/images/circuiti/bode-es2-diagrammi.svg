    <line class="grid" x1="642.0" y1="618.0" x2="642.0" y2="398.0"/>
    <line class="grid" x1="90.0" y1="598.0" x2="642.0" y2="598.0"/>
    <line class="grid" x1="90.0" y1="553.0" x2="642.0" y2="553.0"/>
    <line class="guide" x1="90.0" y1="508.0" x2="642.0" y2="508.0"/>
    <line class="grid" x1="90.0" y1="463.0" x2="642.0" y2="463.0"/>
    <line class="grid" x1="90.0" y1="418.0" x2="642.0" y2="418.0"/>
