<svg xmlns="http://www.w3.org/2000/svg" class="gr" viewBox="0 0 560 470" width="560" height="470" role="img" aria-labelledby="t3 d3">
  <title id="t3">Esercizio 3.3: fasori delle tensioni</title>
  <desc id="d3">Fasori di Vg (20 V, 0°), VR (14,14 V, 45°), VL (14,14 V, 135°) e VC (28,28 V, -45°) nel piano complesso, con la loro somma testa-coda che arriva in punta a Vg.</desc>

  <style>
.gr {
  /* colori (stessa palette delle figure della giunzione PN) */
  --ink: #1f2933;
  --muted: #6b7785;
  --R: #0f766e;      /* resistore, potenza attiva P */
  --L: #a16207;      /* induttore, potenza reattiva Q */
  --C: #d1342b;      /* condensatore, potenza reattiva del condensatore Q_C */
  --u1: #0f766e;     /* es. 3.2: prima tensione */
  --u2: #d1342b;     /* es. 3.2: seconda tensione */
  --us: #1d5fd1;     /* somma: v(t) in 3.2, fasore somma in 3.3 e 3.4 */
  font-family: Georgia, "Times New Roman", serif;
}
.gr text { fill: var(--ink); }

/* assi e riferimenti */
.gr .axis  { stroke: var(--ink); stroke-width: 2; fill: none; }
.gr .tick  { stroke: var(--ink); stroke-width: 2; fill: none; }
.gr .guide { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 3 4; opacity: .85; fill: none; }
.gr .grid  { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 5; opacity: .45; fill: none; }
.gr .dim   { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.gr .mk-ink { fill: var(--ink); }

/* curve, fasori, lati dei triangoli */
.gr .curve { fill: none; stroke-width: 3.6; stroke-linejoin: round; stroke-linecap: round; }
.gr .curve.thin { stroke-width: 2.6; }
.gr .vec   { fill: none; stroke-width: 3.6; stroke-linecap: round; }
.gr .ghost { fill: none; stroke-width: 2.4; stroke-dasharray: 7 5; stroke-linecap: round; opacity: .6; }
.gr .side  { fill: none; stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; }
.gr .wash  { fill: var(--ink); opacity: .045; stroke: none; }

/* testi */
.gr .t-num   { font-size: 14px; }
.gr .t-val   { font-size: 15px; }
.gr .t-small { font-size: 13.5px; }
.gr .t-lab   { font-size: 17px; }
.gr .t-title { font-size: 16px; font-weight: 700; }
.gr .t-mute  { fill: var(--muted); }
.gr .t-end   { text-anchor: end; }
.gr .t-mid   { text-anchor: middle; }
.gr .it  { font-style: italic; }
.gr .sm  { font-size: .75em; }
.gr .b   { font-weight: 700; }
.gr .s-ink { stroke: var(--ink); }
.gr .f-ink { fill: var(--ink); }
.gr .t-ink { fill: var(--ink); }
.gr .mk-ink { fill: var(--ink); }
.gr .s-R { stroke: var(--R); }
.gr .f-R { fill: var(--R); }
.gr .t-R { fill: var(--R); }
.gr .mk-R { fill: var(--R); }
.gr .s-L { stroke: var(--L); }
.gr .f-L { fill: var(--L); }
.gr .t-L { fill: var(--L); }
.gr .mk-L { fill: var(--L); }
.gr .s-C { stroke: var(--C); }
.gr .f-C { fill: var(--C); }
.gr .t-C { fill: var(--C); }
.gr .mk-C { fill: var(--C); }
.gr .s-u1 { stroke: var(--u1); }
.gr .f-u1 { fill: var(--u1); }
.gr .t-u1 { fill: var(--u1); }
.gr .mk-u1 { fill: var(--u1); }
.gr .s-u2 { stroke: var(--u2); }
.gr .f-u2 { fill: var(--u2); }
.gr .t-u2 { fill: var(--u2); }
.gr .mk-u2 { fill: var(--u2); }
.gr .s-us { stroke: var(--us); }
.gr .f-us { fill: var(--us); }
.gr .t-us { fill: var(--us); }
.gr .mk-us { fill: var(--us); }
  </style>

  <defs>
    <marker id="ah-ax3" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path class="mk-ink" d="M0 0L10 5L0 10z"/></marker>
    <marker id="ah-ink3" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto"><path class="mk-ink" d="M0 0L10 5L0 10z"/></marker>
    <marker id="ah-R3" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto"><path class="mk-R" d="M0 0L10 5L0 10z"/></marker>
    <marker id="ah-L3" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto"><path class="mk-L" d="M0 0L10 5L0 10z"/></marker>
    <marker id="ah-C3" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto"><path class="mk-C" d="M0 0L10 5L0 10z"/></marker>
    <marker id="ah-u13" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto"><path class="mk-u1" d="M0 0L10 5L0 10z"/></marker>
    <marker id="ah-u23" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto"><path class="mk-u2" d="M0 0L10 5L0 10z"/></marker>
    <marker id="ah-us3" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto"><path class="mk-us" d="M0 0L10 5L0 10z"/></marker>
  </defs>

  <g id="piano">
    <line class="grid" x1="115.0" y1="424.5" x2="115.0" y2="79.5"/>
    <line class="grid" x1="265.0" y1="424.5" x2="265.0" y2="79.5"/>
    <line class="grid" x1="340.0" y1="424.5" x2="340.0" y2="79.5"/>
    <line class="grid" x1="85.0" y1="402.0" x2="415.0" y2="402.0"/>
    <line class="grid" x1="85.0" y1="327.0" x2="415.0" y2="327.0"/>
    <line class="grid" x1="85.0" y1="177.0" x2="415.0" y2="177.0"/>
    <line class="grid" x1="85.0" y1="102.0" x2="415.0" y2="102.0"/>
    <line class="axis" x1="85.0" y1="252.0" x2="427.0" y2="252.0" marker-end="url(#ah-ax3)"/>
    <line class="axis" x1="190.0" y1="424.5" x2="190.0" y2="67.5" marker-end="url(#ah-ax3)"/>
    <text class="t-lab" x="437.0" y="257.0">Re (V)</text>
    <text class="t-lab" x="200.0" y="59.5">Im (V)</text>
    <path class="tick" d="M115.0 247.0V257.0"/>
    <text class="t-num t-mid" x="115.0" y="445.5">−10</text>
    <path class="tick" d="M265.0 247.0V257.0"/>
    <text class="t-num t-mid" x="265.0" y="445.5">10</text>
    <path class="tick" d="M340.0 247.0V257.0"/>
    <text class="t-num t-mid" x="340.0" y="445.5">20</text>
    <path class="tick" d="M185.0 402.0H195.0"/>
    <text class="t-num t-end" x="76.0" y="407.0">−20</text>
    <path class="tick" d="M185.0 327.0H195.0"/>
    <text class="t-num t-end" x="76.0" y="332.0">−10</text>
    <path class="tick" d="M185.0 177.0H195.0"/>
    <text class="t-num t-end" x="76.0" y="182.0">10</text>
    <path class="tick" d="M185.0 102.0H195.0"/>
    <text class="t-num t-end" x="76.0" y="107.0">20</text>
    <line class="ghost s-R" x1="115.0" y1="177.0" x2="183.6" y2="108.4" marker-end="url(#ah-R3)"/>
    <line class="ghost s-C" x1="190.0" y1="102.0" x2="333.6" y2="245.6" marker-end="url(#ah-C3)"/>
    <path class="dim" d="M224.0 252.0 A34 34 0 0 0 214.0 228.0"/>
    <text class="t-small t-mid" x="234.3" y="238.6">45°</text>
    <path class="dim" d="M242.0 252.0 A52 52 0 0 0 153.2 215.2"/>
    <text class="t-small t-mid" x="215.3" y="196.0">135°</text>
    <path class="dim" d="M224.0 252.0 A34 34 0 0 1 214.0 276.0"/>
    <text class="t-small t-mid" x="236.2" y="276.1">−45°</text>
    <line class="vec s-C" x1="190.0" y1="252.0" x2="333.6" y2="395.6" marker-end="url(#ah-C3)"/>
    <line class="vec s-L" x1="190.0" y1="252.0" x2="121.4" y2="183.4" marker-end="url(#ah-L3)"/>
    <line class="vec s-R" x1="190.0" y1="252.0" x2="258.6" y2="183.4" marker-end="url(#ah-R3)"/>
    <line class="vec s-us" x1="190.0" y1="252.0" x2="330.9" y2="252.0" marker-end="url(#ah-us3)"/>
    <circle class="f-ink" cx="190.0" cy="252.0" r="3.5"/>
    <text class="t-val t-us" x="350.0" y="243.0"><tspan class="b">V</tspan><tspan class="it sm" dy="4.5">g</tspan><tspan dy="-4.5"> = 20 V</tspan></text>
    <text class="t-val t-R" x="277.0" y="163.0"><tspan class="b">V</tspan><tspan class="it sm" dy="4.5">R</tspan><tspan dy="-4.5"> = 14,14 V</tspan></text>
    <text class="t-val t-end t-L" x="123.0" y="161.0"><tspan class="b">V</tspan><tspan class="it sm" dy="4.5">L</tspan><tspan dy="-4.5"> = 14,14 V</tspan></text>
    <text class="t-val t-C" x="352.0" y="422.0"><tspan class="b">V</tspan><tspan class="it sm" dy="4.5">C</tspan><tspan dy="-4.5"> = 28,28 V</tspan></text>
    <text class="t-small t-mute" x="250.0" y="98.2">linee tratteggiate: somma testa-coda</text>
    <text class="t-small t-mute" x="250.0" y="114.2"><tspan class="b">V</tspan><tspan class="it sm" dy="4.5">R</tspan><tspan dy="-4.5"> + </tspan><tspan class="b">V</tspan><tspan class="it sm" dy="4.5">L</tspan><tspan dy="-4.5"> + </tspan><tspan class="b">V</tspan><tspan class="it sm" dy="4.5">C</tspan><tspan dy="-4.5"> = </tspan><tspan class="b">V</tspan><tspan class="it sm" dy="4.5">g</tspan></text>
  </g>
</svg>
