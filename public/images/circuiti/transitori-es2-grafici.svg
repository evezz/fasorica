<svg xmlns="http://www.w3.org/2000/svg" class="gr" viewBox="0 0 800 332" width="800" height="332" role="img" aria-labelledby="t2 d2">
  <title id="t2">Esercizio 2.2: tensione sul condensatore e corrente nel resistore</title>
  <desc id="d2">Scarica di un condensatore da 12 V su un resistore: tensione e corrente decrescono con lo stesso andamento esponenziale.</desc>

  <style>
.gr {
  /* colori (stessa palette delle figure della giunzione PN) */
  --ink: #1f2933;
  --muted: #6b7785;
  --v: #0f766e;     /* tensioni */
  --v2: #d1342b;    /* seconda tensione (solo es. 2.4) */
  --i: #1d5fd1;     /* correnti */
  font-family: Georgia, "Times New Roman", serif;
}
.gr text { fill: var(--ink); }

/* assi e riferimenti */
.gr .axis  { stroke: var(--ink); stroke-width: 2; fill: none; }
.gr .tick  { stroke: var(--ink); stroke-width: 2; fill: none; }
.gr .guide { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 3 4; opacity: .85; fill: none; }
.gr .grid  { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 5; opacity: .4; fill: none; }
.gr .asym  { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }
.gr .mk-ink { fill: var(--ink); }

/* curve e punti */
.gr .curve { fill: none; stroke-width: 3.6; stroke-linejoin: round; stroke-linecap: round; }
.gr .jump  { fill: none; stroke-width: 2.2; stroke-dasharray: 2 4; stroke-linecap: round; }
.gr .c-v  { stroke: var(--v); }
.gr .c-v2 { stroke: var(--v2); }
.gr .c-i  { stroke: var(--i); }
.gr .p-v  { fill: var(--v); }
.gr .p-v2 { fill: var(--v2); }
.gr .p-i  { fill: var(--i); }

/* testi */
.gr .t-num   { font-size: 14px; }
.gr .t-val   { font-size: 15px; }
.gr .t-small { font-size: 13.5px; }
.gr .t-lab   { font-size: 17px; }
.gr .t-end   { text-anchor: end; }
.gr .t-mid   { text-anchor: middle; }
.gr .it  { font-style: italic; }
.gr .sm  { font-size: .75em; }
  </style>

