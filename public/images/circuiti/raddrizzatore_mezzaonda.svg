    <line x1="135" y1="119" x2="135" y2="141" stroke="#0f172a" stroke-width="2"/>
    <text x="125" y="108" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-style="italic" font-size="14" font-weight="700" fill="#0f172a">D</text>

    <!-- resistenza -->
    <path d="M 220 130 V 200 L 212 205 L 228 215 L 212 225 L 228 235 L 212 245 L 228 255 L 220 260 V 330" fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/>
    <text x="203" y="236" text-anchor="end" font-family="Georgia, Times New Roman, serif" font-style="italic" font-size="14" font-weight="700" fill="#0f172a">R</text>
    <circle cx="220" cy="130" r="3" fill="#0f172a"/>
    <circle cx="220" cy="330" r="3" fill="#0f172a"/>

    <!-- tensione di uscita sul carico (la freccia punta al morsetto +) -->
