<svg viewBox="0 0 880 450" width="100%" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <title>Raddrizzatore a semionda: schema circuitale e forme d'onda</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#0f172a"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#166534"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="880" height="450" fill="#ffffff"/>

  <!-- ===================== SCHEMA CIRCUITALE ===================== -->
  <g>
    <rect x="10" y="30" width="310" height="380" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>
    <text x="165" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a" letter-spacing="0.5">SCHEMA CIRCUITALE</text>

    <!-- generatore -->
    <circle cx="70" cy="230" r="18" fill="none" stroke="#0f172a" stroke-width="2"/>
    <path d="M 59 230 C 62 219, 67 219, 70 230 S 78 241, 81 230" fill="none" stroke="#0f172a" stroke-width="2"/>
    <text x="96" y="235" font-family="Georgia, Times New Roman, serif" font-style="italic" font-size="14" font-weight="700" fill="#2563eb">v<tspan dy="3" font-size="10">in</tspan><tspan dy="-3">(t)</tspan></text>

    <!-- fili -->
    <line x1="70" y1="130" x2="70" y2="212" stroke="#0f172a" stroke-width="2"/>
    <line x1="70" y1="248" x2="70" y2="330" stroke="#0f172a" stroke-width="2"/>
    <line x1="70" y1="130" x2="115" y2="130" stroke="#0f172a" stroke-width="2"/>
    <line x1="135" y1="130" x2="220" y2="130" stroke="#0f172a" stroke-width="2"/>
    <line x1="70" y1="330" x2="272" y2="330" stroke="#0f172a" stroke-width="2"/>

    <!-- diodo (anodo a sinistra, catodo a destra) -->
