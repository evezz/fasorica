<svg xmlns="http://www.w3.org/2000/svg" class="gr" viewBox="0 0 648 332" width="648" height="332" role="img" aria-labelledby="t2 d2">
  <title id="t2">Esercizio 3.2: tensioni in funzione di ωt</title>
  <desc id="d2">Le tensioni v1 e v2 e la loro somma v. A t = 0 valgono 6,00 V, -4,33 V e 1,67 V.</desc>

  <style>
.gr {
  /* colori (stessa palette delle figure della giunzione PN) */
  --ink: #1f2933;
  --muted: #6b7785;
  --R: #0f766e;      /* resistore, potenza attiva P */
  --L: #a16207;      /* induttore, potenza reattiva Q */
  --C: #d1342b;      /* condensatore, potenza reattiva del condensatore Q_C */
  --u1: #0f766e;     /* es. 3.2: prima tensione */
  --u2: #d1342b;     /* es. 3.2: seconda tensione */
  --us: #1d5fd1;     /* es. 3.2: somma */
  font-family: Georgia, "Times New Roman", serif;
}
.gr text { fill: var(--ink); }

/* assi e riferimenti */
.gr .axis  { stroke: var(--ink); stroke-width: 2; fill: none; }
.gr .tick  { stroke: var(--ink); stroke-width: 2; fill: none; }
.gr .guide { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 3 4; opacity: .85; fill: none; }
.gr .grid  { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 5; opacity: .45; fill: none; }
.gr .dim   { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.gr .mk-ink { fill: var(--ink); }

/* curve, fasori, lati dei triangoli */
.gr .curve { fill: none; stroke-width: 3.6; stroke-linejoin: round; stroke-linecap: round; }
.gr .curve.thin { stroke-width: 2.6; }
.gr .vec   { fill: none; stroke-width: 3.6; stroke-linecap: round; }
.gr .ghost { fill: none; stroke-width: 2.4; stroke-dasharray: 7 5; stroke-linecap: round; opacity: .6; }
.gr .side  { fill: none; stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; }
.gr .wash  { fill: var(--ink); opacity: .045; stroke: none; }

/* testi */
.gr .t-num   { font-size: 14px; }
.gr .t-val   { font-size: 15px; }
.gr .t-small { font-size: 13.5px; }
.gr .t-lab   { font-size: 17px; }
.gr .t-title { font-size: 16px; font-weight: 700; }
.gr .t-mute  { fill: var(--muted); }
.gr .t-end   { text-anchor: end; }
.gr .t-mid   { text-anchor: middle; }
.gr .it  { font-style: italic; }
.gr .sm  { font-size: .75em; }
.gr .u   { text-decoration: underline; }
.gr .s-ink { stroke: var(--ink); }
.gr .f-ink { fill: var(--ink); }
.gr .t-ink { fill: var(--ink); }
.gr .mk-ink { fill: var(--ink); }
.gr .s-R { stroke: var(--R); }
.gr .f-R { fill: var(--R); }
.gr .t-R { fill: var(--R); }
.gr .mk-R { fill: var(--R); }
.gr .s-L { stroke: var(--L); }
.gr .f-L { fill: var(--L); }
.gr .t-L { fill: var(--L); }
.gr .mk-L { fill: var(--L); }
.gr .s-C { stroke: var(--C); }
.gr .f-C { fill: var(--C); }
.gr .t-C { fill: var(--C); }
.gr .mk-C { fill: var(--C); }
.gr .s-u1 { stroke: var(--u1); }
.gr .f-u1 { fill: var(--u1); }
.gr .t-u1 { fill: var(--u1); }
.gr .mk-u1 { fill: var(--u1); }
.gr .s-u2 { stroke: var(--u2); }
.gr .f-u2 { fill: var(--u2); }
.gr .t-u2 { fill: var(--u2); }
.gr .mk-u2 { fill: var(--u2); }
.gr .s-us { stroke: var(--us); }
.gr .f-us { fill: var(--us); }
.gr .t-us { fill: var(--us); }
.gr .mk-us { fill: var(--us); }
  </style>

